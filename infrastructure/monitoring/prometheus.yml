global:
  scrape_interval: 15s

scrape_configs:
  - job_name: finguard-api
    metrics_path: /metrics
    static_configs:
      # backend running inside Docker Compose (profile "app")
      - targets: ["backend:8000"]
        labels: {mode: docker}
      # backend running on your machine with uvicorn (the usual dev setup)
      - targets: ["host.docker.internal:8000"]
        labels: {mode: host}
