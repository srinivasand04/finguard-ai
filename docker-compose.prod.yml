# Production overlay - use together with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#
# What changes compared with local development
# * Only Caddy is reachable from the internet (ports 80/443, automatic HTTPS).
# * Postgres, Redis, Qdrant, the API and the frontend publish NO host ports - they talk on the
#   private Docker network only. /metrics is not routed publicly.
# * ENVIRONMENT=production: the API refuses to start with a weak JWT_SECRET and seed-users
#   refuses the public demo password.
# * Everything restarts automatically after a crash or a server reboot.

services:
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []
    restart: unless-stopped

  qdrant:
    ports: !reset []
    restart: unless-stopped

  backend:
    ports: !reset []
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      LLM_PROVIDER: ${LLM_PROVIDER:-auto}
      CORS_ORIGINS: '["https://${DOMAIN}"]'
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers",
              "--forwarded-allow-ips", "*"]
    volumes:
      - hf_cache:/root/.cache/huggingface    # embedding/reranker models survive restarts

  frontend:
    ports: !reset []
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4-alpine
    profiles: ["app"]
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env (e.g. finguard.example.com or <server-ip>.sslip.io)}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  # monitoring stays private: reach Grafana through an SSH tunnel (see docs/DEPLOYMENT.md)
  prometheus:
    ports: !override ["127.0.0.1:9090:9090"]
    restart: unless-stopped

  grafana:
    ports: !override ["127.0.0.1:3000:3000"]
    restart: unless-stopped

volumes:
  hf_cache:
  caddy_data:
  caddy_config:
